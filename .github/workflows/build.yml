name: Build and test

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "dist/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build using the upstream v1.2.0 build pipeline
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Commit generated dist files
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "dist is already up to date."
            exit 0
          fi
          git commit -m "chore(build): refresh dist artifacts"
          git push origin "HEAD:${GITHUB_REF}"
